name: Process Video Workflow

on:
  repository_dispatch:
    types: [start_upload_job]

jobs:
  process_video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Aria2 & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install requests firebase-admin pysubs2 deep-translator requests-toolbelt torrentool beautifulsoup4 python-dotenv faster-whisper

      - name: Run Worker Script
        env:
          JOB_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          ABYSS_API_KEY: ${{ secrets.ABYSS_API_KEY }}
          ABYSS_EMAIL: ${{ secrets.ABYSS_EMAIL }}
          ABYSS_PASSWORD: ${{ secrets.ABYSS_PASSWORD }}
        run: python worker.py
